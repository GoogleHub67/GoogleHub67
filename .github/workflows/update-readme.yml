name: Update Profile Metrics Directory
on:
  schedule:
    - cron: '0 0 * * *' # Wakes up automatically every night at 12:00 AM UTC
  workflow_dispatch: # Allows you to force run it manually whenever you want

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Codebase
        uses: actions/checkout@v4

      - name: Initialize Python Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Live Telemetry Data Scraper
        shell: python  # 👈 THIS TELLS GITHUB TO RUN IT AS PYTHON, NOT BASH!
        run: |
          import urllib.request
          import json
          import re

          # Standard desktop browser identity to prevent API blocks
          browser_headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          # 1. Query LeetCode GraphQL Core Engine for Daily Problem
          leetcode_query = {"query": "query questionOfYourDay { activeDailyCodingChallengeQuestion { date link question { questionFrontendId title difficulty } } }"}
          req_lc_headers = browser_headers.copy()
          req_lc_headers["Content-Type"] = "application/json"
          
          req = urllib.request.Request("https:// leetcode.com/problemset".replace("https:// ", "https://"), 
                                       data=json.dumps(leetcode_query).encode('utf-8'), 
                                       headers=req_lc_headers)
          try:
              with urllib.request.urlopen(req) as response:
                  lc_data = json.loads(response.read().decode('utf-8'))['data']['activeDailyCodingChallengeQuestion']
                  title = lc_data['question']['title']
                  num = lc_data['question']['questionFrontendId']
                  diff = lc_data['question']['difficulty'].upper()
                  url = f"https:// leetcode.com{lc_data['link']}".replace("https:// ", "https://")
                  leetcode_string = f"[{num}. {title} ({diff})]({url})"
          except Exception:
              leetcode_string = "[Access Current Problem Set Portal](https:// leetcode.com)".replace("https:// ", "https://")

          # 2. Query daily.dev Global News Manifest
          req_dd = urllib.request.Request("https:// api.daily.dev/rss/feed".replace("https:// ", "https://"), headers=browser_headers)
          try:
              with urllib.request.urlopen(req_dd) as response:
                  rss = response.read().decode('utf-8')
                  news_title = re.search(r"<item>.*?<title>(.*?)</title>", rss, re.DOTALL).group(1).strip()
                  news_link = re.search(r"<item>.*?<link>(.*?)</link>", rss, re.DOTALL).group(1).strip()
                  news_string = f"[{news_title}]({news_link})"
          except Exception:
              news_string = "[Explore Live Trending Tech Stream](https:// daily.dev)".replace("https:// ", "https://")

          # 3. Generate the New Markdown Matrix Layout
          updated_matrix = (
              "<!-- START_ECOSYSTEM_METRICS -->\n"
              "| Environment Gateway | Real-Time Node Context | System Status |\n"
              "| :--- | :--- | :---: |\n"
              f"| **📰 daily.dev Feed** | {news_string} | `ACTIVE` 🟢 |\n"
              f"| **🧠 LeetCode Engine** | {leetcode_string} | `ONLINE` 🟢 |\n"
              "<!-- END_ECOSYSTEM_METRICS -->"
          ).replace("https:// ", "https://")

          # 4. Inject Matrix Code directly into README without layout damage
          with open("README.md", "r", encoding="utf-8") as file:
              content = file.read()

          pattern = r"<!-- START_ECOSYSTEM_METRICS -->.*?<!-- END_ECOSYSTEM_METRICS -->"
          modified_content = re.sub(pattern, updated_matrix, content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(modified_content)

      - name: Securely Commit and Push Updates to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "automation: telemetry sync matrix update [secure]"
          git push
