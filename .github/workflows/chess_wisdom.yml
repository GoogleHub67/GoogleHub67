name: Dispense Chess Wisdom

on:
  schedule:
    - cron: '0 0 * * *'  # Runs natively on autopilot every single day at midnight UTC
  repository_dispatch:
    types: [dispense_wisdom]
  workflow_dispatch:     # Retains your manual click trigger button in the Actions panel

jobs:
  telemetry_fetch:
    name: Execute Gambit Telemetry Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Crucial layer allowing the GitHub runner to push changes back to your README
    
    steps:
      - name: Initialize Mainframe Connection & Checkout Code
        uses: actions/checkout@v4

      - name: Validate Database Integrity
        run: |
          if [ ! -f chess_tips.json ]; then
            echo "::error::CRITICAL FAULT: chess_tips.json is missing from the repository root."
            exit 1
          fi
          
          # Check if JSON structure is valid syntax
          if ! jq empty chess_tips.json 2>/dev/null; then
            echo "::error::CRITICAL FAULT: chess_tips.json contains invalid syntax or bad formatting."
            exit 1
          fi

      - name: Parse Telemetry Array & Extract Random Data Block
        id: parse_data
        run: |
          # Fetch a completely randomized object row from the array matrix
          RANDOM_ROW=\$(jq -c '.[]' chess_tips.json | shuf -n 1)
          
          # Corrected Command Substitution Syntax
          ID=\$(echo "\$RANDOM_ROW" | jq -r '.id // "GAMBIT_???"')
          NAME=\$(echo "\$RANDOM_ROW" | jq -r '.name // "Unknown Payload"')
          MOVES=\$(echo "\$RANDOM_ROW" | jq -r '.defining_moves // "1.e4 e5"')
          PROFILE=\$(echo "\$RANDOM_ROW" | jq -r '.tactical_profile // "No telemetric logs extracted."')
          STATUS=\$(echo "\$RANDOM_ROW" | jq -r '.system_status // "UNKNOWN ⚪"')


          # Output to terminal logs with your authentic cyberpunk formatting
          echo "==========================================================================="
          echo "♟️  GOOGLEHUB67 TELEMETRY DISPATCH SYSTEM | STATUS: ACTIVE"
          echo "==========================================================================="
          echo "  [+] DATASET IDENTITY INDEX    : \$ID"
          echo "  [+] TARGET OPENING REGISTERED : \$NAME"
          echo "  [+] DEFINING SYSTEM MOVES     : \$MOVES"
          echo "  [+] COMPLIANCE STATE STATUS   : \$STATUS"
          echo "---------------------------------------------------------------------------"
          echo "  [>] TELEMETRIC INSTRUCTION LOGS:"
          echo "      \$PROFILE"
          echo "==========================================================================="
          echo "STATUS: DATASET DEPLOYED SUCCESSFUL. BUFFER FLUSHED. STANDBY..."
          echo "==========================================================================="

          # Write values safely to the environment file to pass into the next deployment step
          {
            echo "WISDOM_ID=\$ID"
            echo "WISDOM_NAME=\$NAME"
            echo "WISDOM_MOVES=\$MOVES"
            echo "WISDOM_PROFILE=\$PROFILE"
            echo "WISDOM_STATUS=\$STATUS"
          } >> "\$GITHUB_ENV"

      - name: Inject Telemetry Payload Into Profile Matrix
        env:
          MARKDOWN_PAYLOAD: |
            ### ♟ Telemetry Broadcast: Gambit of the Day
            > **[${{ env.WISDOM_ID }}]${{ env.WISDOM_NAME }}**
            > * **Moves:** \`${{ env.WISDOM_MOVES }}\`
            > * **Tactical Profile:** *\${{ env.WISDOM_PROFILE }}*
            > * **System Status:** \`${{ env.WISDOM_STATUS }}\`
        run: |
          # Use an automated perl stream block to safely replace the target array contents inside the README
          perl -0777 -pi -e "s/(<!-- CHESS_WISDOM_START -->)(.*?)(<!-- CHESS_WISDOM_END -->)/\$1\n\$ENV{MARKDOWN_PAYLOAD}\n\$3/s" README.md

      - name: Deploy Modifications to Profile Matrix
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit and push if a change actually took place to avoid useless workflow errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Telemetry Sync: Gambit of the Day Injected" && git push)
